[build-system]
requires = ["flit_core>=3.7"]
build-backend = "flit_core.buildapi"

[project]
name = "sphinxcontrib-nexus"
# Version is single-sourced from sphinxcontrib/nexus/__init__.py
# (__version__); flit extracts the literal at build time.
dynamic = ["version"]
description = "Unified code + documentation knowledge graph from Sphinx builds and Python AST analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Rodrigo de Oliveira", email = "deOliveira.R@outlook.com"},
]
keywords = [
    "sphinx", "knowledge-graph", "documentation", "ast", "mcp",
    "code-analysis", "impact-analysis", "networkx",
]
dependencies = [
    "Sphinx>=7.0",
    "networkx>=3.0",
    # Floor is load-bearing: `mcp.server.mcpserver.MCPServer` (the 1.x
    # `FastMCP` successor) does not exist before 2.0, and 2.0 renamed
    # `Tool.inputSchema` → `input_schema`. server.py targets the 2.x API,
    # so an older mcp fails at import rather than degrading.
    "mcp>=2.0",
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/deOliveira-R/sphinxcontrib-nexus"
Repository = "https://github.com/deOliveira-R/sphinxcontrib-nexus"
Issues = "https://github.com/deOliveira-R/sphinxcontrib-nexus/issues"

[project.scripts]
nexus = "sphinxcontrib.nexus.cli:main"

[project.optional-dependencies]
# sphinx-proof is optional for users but required to test the `prf`
# extractor against a real build rather than a hand-built fixture.
test = ["pytest", "sphinx-proof"]
dev = ["ruff", "mypy"]
# Building nexus's own documentation. The docs enable the extension, so a
# docs build is also an end-to-end exercise of it against a real project.
docs = ["myst-parser", "sphinx"]
viz = []  # Sigma.js loaded from CDN, no Python deps needed

[tool.flit.module]
name = "sphinxcontrib.nexus"

[tool.flit.sdist]
include = ["sphinxcontrib/nexus/skills/**/*.md"]
